[package]
name = "example"
version = "0.1.0"
description = "Starter experiment program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "example"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
common = { path = "../../lib/common" }

[dev-dependencies]
mollusk-svm = "0.10.3"
solana-account = "3.2"
solana-instruction = "3.0"
solana-pubkey = "4.0"
solana-rent = "3.0"
